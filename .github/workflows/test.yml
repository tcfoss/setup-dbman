name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'   # weekly, catches drift in dbman releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux-x64
          - ubuntu-24.04-arm     # linux-arm64
          - macos-15-intel       # osx-x64
          - macos-latest         # osx-arm64
          - windows-latest       # win-x64
          - windows-11-arm       # win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dbman
        id: setup
        uses: ./

      - name: Verify dbman is on PATH
        shell: bash
        env:
          EXPECTED: ${{ steps.setup.outputs.version }}
        run: |
          actual="$(dbman --version)"
          echo "dbman reports: $actual"
          [ "$actual" = "$EXPECTED" ]

      - name: Verify help succeeds
        shell: bash
        run: |
          dbman --help
